<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>METROLOGIA V26.3 CLOUD</title>
    
    <style>
        :root {
            --bg: #0F172A; --card-bg: #1E293B; --text: #F1F5F9;
            --primary: #3B82F6; --border: #334155;
            --input-bg: #1E293B; --input-text: #FFFFFF;
            --st-purple: #C084FC; --st-red: #F87171;    
            --st-orange: #FB923C; --st-yellow: #FACC15; 
            --st-green: #4ADE80;  
        }

        [data-theme="light"] {
            --bg: #F8FAFC; --card-bg: #FFFFFF; --text: #1E293B;
            --primary: #2563EB; --border: #E2E8F0;
            --input-bg: #FFFFFF; --input-text: #0F172A;
            --st-purple: #9333EA; --st-red: #DC2626;    
            --st-orange: #EA580C; --st-yellow: #CA8A04; 
            --st-green: #16A34A;
        }

        BODY, .system-input, SELECT, BUTTON, TABLE { TEXT-TRANSFORM: UPPERCASE; }
        .login-input { TEXT-TRANSFORM: NONE !important; }

        BODY { FONT-FAMILY: 'Segoe UI', SANS-SERIF; BACKGROUND: var(--bg); COLOR: var(--text); MARGIN: 0; TRANSITION: BACKGROUND 0.3S; OVERFLOW-X: HIDDEN; }
        #loginOverlay { POSITION: FIXED; TOP: 0; LEFT: 0; WIDTH: 100%; HEIGHT: 100%; BACKGROUND: var(--bg); DISPLAY: FLEX; ALIGN-ITEMS: CENTER; JUSTIFY-CONTENT: CENTER; Z-INDEX: 9999; }
        .login-card { BACKGROUND: var(--card-bg); PADDING: 30PX; BORDER-RADIUS: 8PX; BORDER: 1PX SOLID var(--primary); TEXT-ALIGN: CENTER; WIDTH: 320PX; }
        #mainContent { PADDING: 10PX; DISPLAY: NONE; }
        .card { BACKGROUND: var(--card-bg); PADDING: 12PX; BORDER-RADIUS: 6PX; BORDER: 1PX SOLID var(--border); MARGIN-BOTTOM: 10PX; }
        H2 { MARGIN: 0 0 10PX 0; COLOR: var(--primary); FONT-SIZE: 0.75REM; BORDER-BOTTOM: 1PX SOLID var(--border); PADDING-BOTTOM: 5PX; }
        .form-group { DISPLAY: GRID; GRID-TEMPLATE-COLUMNS: REPEAT(AUTO-FIT, MINMAX(120PX, 1FR)); GAP: 6PX; MARGIN-BOTTOM: 10PX; }
        INPUT, SELECT, BUTTON { PADDING: 8PX; BORDER: 1PX SOLID var(--border); BORDER-RADIUS: 4PX; BACKGROUND: var(--input-bg); COLOR: var(--input-text); FONT-SIZE: 0.7REM; }
        .stats-container { DISPLAY: GRID; GRID-TEMPLATE-COLUMNS: REPEAT(AUTO-FIT, MINMAX(120PX, 1FR)); GAP: 8PX; MARGIN-BOTTOM: 15PX; }
        .stat-box { PADDING: 10PX; BORDER-RADIUS: 4PX; TEXT-ALIGN: CENTER; FONT-WEIGHT: 900; FONT-SIZE: 0.7REM; BORDER: 2PX SOLID var(--border); BACKGROUND: var(--card-bg); }
        TABLE { WIDTH: 100%; BORDER-COLLAPSE: COLLAPSE; }
        TH, TD { TEXT-ALIGN: LEFT; PADDING: 6PX 4PX; BORDER-BOTTOM: 1PX SOLID var(--border); FONT-SIZE: 0.6REM; }
        TH { COLOR: var(--primary); BACKGROUND: rgba(0,0,0,0.1); }
        .status { PADDING: 2PX 6PX; BORDER-RADIUS: 3PX; FONT-WEIGHT: 900; COLOR: #FFF; }
        .st-vencido { BACKGROUND: var(--st-purple); }
        .st-a3 { BACKGROUND: var(--st-red); }
        .st-a2 { BACKGROUND: var(--st-orange); }
        .st-a1 { BACKGROUND: var(--st-yellow); COLOR: #000 !important; }
        .st-ok { BACKGROUND: var(--st-green); }
        .btn-header { PADDING: 5PX 12PX; FONT-WEIGHT: BOLD; CURSOR: POINTER; BORDER-RADIUS: 4PX; BORDER: NONE; COLOR: #FFF; }
        .btn-add { BACKGROUND: var(--primary); COLOR: #FFF; CURSOR: POINTER; BORDER: NONE; FONT-WEIGHT: BOLD; }
    </style>
</head>
<body data-theme="dark">

<div id="loginOverlay">
    <div class="login-card">
        <h2 style="BORDER: NONE;">🔐 METROLOGIA V26.3 CLOUD</h2>
        <input type="email" id="email" class="login-input" placeholder="seu@email.com" style="MARGIN-BOTTOM: 10PX; WIDTH: 100%;">
        <input type="password" id="pass" class="login-input" placeholder="senha" style="MARGIN-BOTTOM: 15PX; WIDTH: 100%;">
        <button class="btn-add" id="btnLogin" style="WIDTH: 100%; PADDING: 10PX;">ENTRAR NO SISTEMA</button>
        <p id="loginMsg" style="FONT-SIZE: 0.6REM; MARGIN-TOP: 10PX; COLOR: var(--st-red);"></p>
    </div>
</div>

<div id="mainContent">
    <div class="container">
        <header style="DISPLAY: FLEX; JUSTIFY-CONTENT: SPACE-BETWEEN; ALIGN-ITEMS: CENTER; MARGIN-BOTTOM: 15PX; BORDER-BOTTOM: 2PX SOLID var(--primary); PADDING-BOTTOM: 8PX;">
            <h1 style="FONT-SIZE: 1REM; COLOR: var(--primary); MARGIN: 0; FONT-WEIGHT: 900;">📏 METROLOGIA V26.3 CLOUD</h1>
            <div style="DISPLAY: FLEX; GAP: 8PX;">
                <button class="btn-header" style="BACKGROUND: #64748B;" onclick="toggleTheme()">🌓 TEMA</button>
                <button class="btn-header" style="BACKGROUND: var(--st-green);" id="btnCloudSave">💾 SALVAR NUVEM</button>
                <button class="btn-header" style="BACKGROUND: var(--st-red);" id="btnLogout">SAIR</button>
            </div>
        </header>

        <div class="card">
            <h2 id="formTitle">➕ REGISTRAR INSTRUMENTO</h2>
            <div class="form-group">
                <input type="hidden" id="editId">
                <input type="text" id="tag" class="system-input" placeholder="TAG">
                <input type="text" id="cert" class="system-input" placeholder="CERTIFICADO">
                <input type="date" id="last">
                <input type="number" id="period" placeholder="PERIODICIDADE (MESES)">
                <button class="btn-add" id="btnSaveRecord">SALVAR REGISTRO</button>
            </div>
        </div>

        <div class="stats-container" id="statsPanel"></div>

        <div class="card" style="OVERFLOW-X: AUTO;">
            <table id="mainTable">
                <thead>
                    <tr>
                        <th>TAG</th>
                        <th>CERTIFICADO</th>
                        <th>ÚLT. CALIBRAÇÃO</th>
                        <th>VENCIMENTO</th>
                        <th>STATUS / DIAS</th>
                        <th>AÇÕES</th>
                    </tr>
                </thead>
                <tbody id="inventoryBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDZJCef2ZmtKvqbuag5gjc2Pl289RNNl-4",
        authDomain: "controle-de-instrumentos.firebaseapp.com",
        projectId: "controle-de-instrumentos",
        storageBucket: "controle-de-instrumentos.firebasestorage.app",
        messagingSenderId: "596225663409",
        appId: "1:596225663409:web:be8d7abff0a6110e55dd90",
        measurementId: "G-QMFPJ7EKHG"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let localData = [];

    // --- AUTENTICAÇÃO ---
    window.login = () => {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('pass').value;
        signInWithEmailAndPassword(auth, email, pass)
            .catch(err => document.getElementById('loginMsg').innerText = "FALHA: " + err.message);
    };

    document.getElementById('btnLogin').addEventListener('click', window.login);
    document.getElementById('btnLogout').addEventListener('click', () => signOut(auth));

    onAuthStateChanged(auth, (user) => {
        if (user) {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
            syncFromCloud(user.uid);
        } else {
            document.getElementById('loginOverlay').style.display = 'flex';
            document.getElementById('mainContent').style.display = 'none';
        }
    });

    // --- SINCRONIZAÇÃO ---
    function syncFromCloud(uid) {
        const userRef = ref(db, 'users/' + uid);
        onValue(userRef, (snapshot) => {
            const data = snapshot.val();
            localData = data ? data.instruments || [] : [];
            renderTable();
        });
    }

    document.getElementById('btnCloudSave').addEventListener('click', () => {
        const user = auth.currentUser;
        if (user) {
            set(ref(db, 'users/' + user.uid), { instruments: localData })
                .then(() => alert("✅ NUVEM ATUALIZADA COM SUCESSO!"));
        }
    });

    // --- LÓGICA DE NEGÓCIO ---
    window.addItem = () => {
        const item = {
            id: Date.now(),
            tag: document.getElementById('tag').value,
            cert: document.getElementById('cert').value,
            last: document.getElementById('last').value,
            period: parseInt(document.getElementById('period').value)
        };
        if(!item.tag || !item.last) return alert("PREENCHA OS CAMPOS!");
        localData.push(item);
        renderTable();
        clearForm();
    };

    document.getElementById('btnSaveRecord').addEventListener('click', window.addItem);

    function renderTable() {
        const body = document.getElementById('inventoryBody');
        body.innerHTML = '';
        let stats = {v:0, a:0, ok:0};

        localData.forEach(i => {
            const d = new Date(i.last); d.setMonth(d.getMonth() + i.period);
            const diff = Math.ceil((d - new Date()) / (1000 * 60 * 60 * 24));
            
            let sc = "st-ok"; 
            if(diff <= 0) { sc = "st-vencido"; stats.v++; }
            else if(diff <= 30) { sc = "st-a2"; stats.a++; }
            else { stats.ok++; }

            body.innerHTML += `<tr>
                <td>${i.tag}</td><td>${i.cert}</td><td>${i.last}</td>
                <td>${d.toLocaleDateString()}</td>
                <td><span class="status ${sc}">${diff <= 0 ? 'VENCIDO' : diff + ' DIAS'}</span></td>
                <td><button onclick="window.removeItem(${i.id})" style="color:red; background:none; border:none; cursor:pointer;">❌</button></td>
            </tr>`;
        });
        
        document.getElementById('statsPanel').innerHTML = `
            <div class="stat-box" style="color:var(--st-purple)">VENCIDOS: ${stats.v}</div>
            <div class="stat-box" style="color:var(--st-orange)">ALERTA (30D): ${stats.a}</div>
            <div class="stat-box" style="color:var(--st-green)">EM DIA: ${stats.ok}</div>
        `;
    }

    window.removeItem = (id) => {
        localData = localData.filter(x => x.id !== id);
        renderTable();
    };

    function clearForm() {
        document.getElementById('tag').value = '';
        document.getElementById('cert').value = '';
        document.getElementById('last').value = '';
    }

    window.toggleTheme = () => {
        const b = document.body;
        const current = b.getAttribute('data-theme');
        b.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
    };
</script>
</body>
</html>
